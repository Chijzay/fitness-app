<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0d1117"/>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4b4"/>
      <stop offset="100%" stop-color="#00a896"/>
    </linearGradient>
  </defs>
  <!-- Barbell left -->
  <rect x="72" y="230" width="80" height="52" rx="10" fill="#1c2333"/>
  <rect x="72" y="218" width="24" height="76" rx="8" fill="#2a3348"/>
  <rect x="96" y="208" width="16" height="96" rx="6" fill="url(#teal)"/>
  <!-- Barbell bar -->
  <rect x="150" y="248" width="212" height="16" rx="8" fill="url(#teal)"/>
  <!-- Barbell right -->
  <rect x="360" y="230" width="80" height="52" rx="10" fill="#1c2333"/>
  <rect x="408" y="218" width="24" height="76" rx="8" fill="#2a3348"/>
  <rect x="400" y="208" width="16" height="96" rx="6" fill="url(#teal)"/>
  <!-- Trend line -->
  <polyline points="156,360 216,320 276,340 336,280 396,240"
    fill="none" stroke="url(#teal)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <!-- Glow dots -->
  <circle cx="156" cy="360" r="10" fill="#00d4b4" opacity="0.6"/>
  <circle cx="396" cy="240" r="10" fill="#00d4b4" opacity="0.9"/>
</svg>
